<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>KIKI</title>

    <!-- Responsive design meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Fonts & Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/chatbot.css">
  </head>
  <body>

    <header>
        <div class="logo"><a href="index.html"><img src="images/kiki-logo.webp" alt="Kiki Logo"></a></div>
        <div class="tagline">THE BEST E-COMMERCE PLATFORM</div>
        
        <div class="header-right-actions">

    <!-- 1. GUEST VIEW: Sign In and Sell on Kiki (Cart is hidden here) -->
    <div id="guest-header-actions" class="header-auth-buttons" style="display: none;">
        <button class="header-action-btn" onclick="window.location.href='login.html'">Sign In</button>
        <button class="header-action-btn" onclick="window.location.href='org-register.html'">Sell on Kiki</button>
    </div>

    <!-- 2. LOGGED-IN VIEW: Account Dropdown AND Cart Link are both visible here -->
    <div class="user-actions-container" id="logged-in-header-actions" style="display: none;">
        <button class="user-actions" id="account-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21.0001C19.713 17.269 16.7289 14.3151 12.995 14.0662L12 13.9999C11.6446 14.0096 11.3134 14.0225 11.0008 14.0378C7.3 14.2192 4.28417 17.3057 4 21.0001"></path>
                <circle cx="12" cy="6.99988" r="4"></circle>
            </svg><span>Account</span>
        </button>

        <div id="account-dropdown" class="dropdown-menu">
            <ul class="dropdown-links">
                <li><a href="account-info.html">My Account</a></li>
                <li id="dropdown-sell-option"><a href="org-register.html">Sell on Kiki</a></li>
                <li><button id="logout-btn" class="dropdown-logout-btn">LogOut</button></li>
            </ul>
        </div>
    </div>

    <!-- Cart link placed independently inside the logged-in header actions section -->
    <a href="cart/cart.html" class="cart-link" id="logged-in-cart" style="display: none;">
        <img src="images/icons/cart-icon.png" class="cart-icon">
        <span class="cart-quantity">0</span>
        <span class="cart-text">Cart</span>
    </a>
</div>

    </header>

  <div class="search-section">
        <p class="search-title">What are you looking for?</p>
        <div class="search-inputs">
          <input type="text" placeholder="I am looking for..." class="search-input">
          <button class="search-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 17L21 21"></path>
      <path d="M19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19C15.4183 19 19 15.4183 19 11Z"></path>
  </svg>
          </button>
        </div>
  </div>

  <!-- The product lists begins here -->
  <div class="products-grid" id="products-container"></div>

  <!-- Original page functionality -->
  <script type="module" src="scripts/index.js"></script>

  <!-- Separate Cart API Bridge -->
  <script type="module" src="scripts/index-cart-bridge.js"></script>

  <!-- floating chatbox -->
  <div id="chatbot-container">
    <button id="chat-toggle-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 10.5C2 9.72921 2.01346 8.97679 2.03909 8.2503C2.12282 5.87683 2.16469 4.69009 3.13007 3.71745C4.09545 2.74481 5.3157 2.6926 7.7562 2.58819C9.09517 2.5309 10.5209 2.5 12 2.5C13.4791 2.5 14.9048 2.5309 16.2438 2.58819C18.6843 2.6926 19.9046 2.74481 20.8699 3.71745C21.8353 4.69009 21.8772 5.87683 21.9609 8.2503C21.9865 8.97679 22 9.72921 22 10.5C22 11.2708 21.9865 12.0232 21.9609 12.7497C21.8772 15.1232 21.8353 16.3099 20.8699 17.2826C19.9046 18.2552 18.6843 18.3074 16.2437 18.4118C15.5098 18.4432 14.7498 18.4667 13.9693 18.4815C13.2282 18.4955 12.8576 18.5026 12.532 18.6266C12.2064 18.7506 11.9325 18.9855 11.3845 19.4553L9.20503 21.3242C9.07273 21.4376 8.90419 21.5 8.72991 21.5C8.32679 21.5 8 21.1732 8 20.7701V18.4219C7.91842 18.4186 7.83715 18.4153 7.75619 18.4118C5.31569 18.3074 4.09545 18.2552 3.13007 17.2825C2.16469 16.3099 2.12282 15.1232 2.03909 12.7497C2.01346 12.0232 2 11.2708 2 10.5Z"></path>
        <path d="M12.1257 10.5H12.0007M8.125 10.5H8M16.125 10.5H16M12.2507 10.5C12.2507 10.6381 12.1388 10.75 12.0007 10.75C11.8627 10.75 11.7507 10.6381 11.7507 10.5C11.7507 10.3619 11.8627 10.25 12.0007 10.25C12.1388 10.25 12.2507 10.3619 12.2507 10.5ZM8.25 10.5C8.25 10.6381 8.13807 10.75 8 10.75C7.86193 10.75 7.75 10.6381 7.75 10.5C7.75 10.3619 7.86193 10.25 8 10.25C8.13807 10.25 8.25 10.3619 8.25 10.5ZM16.25 10.5C16.25 10.6381 16.1381 10.75 16 10.75C15.8619 10.75 15.75 10.6381 15.75 10.5C15.75 10.3619 15.8619 10.25 16 10.25C16.1381 10.25 16.25 10.3619 16.25 10.5Z"></path>
      </svg> Chat & Search
    </button>

    <div id="chat-window" class="chat-hidden">
      <div class="chat-header">
        <span>Kiki Assistant</span>
        <button id="chat-close-btn" class="close-btn">&times;</button>
      </div>

      <div id="chat-messages" class="chat-messages">
        <div class="message bot-message">
          Hello! Ask me about products or upload an image to search our catalog.
        </div>
      </div>

      <form id="chat-form" class="chat-input-area">
        <input type="file" id="image-input" accept="image/*" style="display: none;" />
        <button type="button" class="icon-btn" id="image-upload-trigger" title="Upload Image">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22.0002 8.99998V15C22.0002 17.8284 22.0002 19.2426 21.1215 20.1213C20.2428 21 18.8286 21 16.0002 21H8.00018C5.17176 21 3.75754 21 2.87886 20.1213C2.00018 19.2426 2.00018 17.8284 2.00018 15V11.0537C2.00018 10.0736 2.00018 9.58356 2.1136 9.18288C2.39734 8.18054 3.18074 7.39714 4.18307 7.11341C4.58376 6.99998 5.07379 6.99998 6.05387 6.99998C6.41985 6.99998 6.60284 6.99998 6.77329 6.97027C7.19563 6.89665 7.58313 6.68926 7.87867 6.37869C7.99794 6.25335 8.29718 5.8045 8.50018 5.49998C8.89656 4.90543 9.09474 4.60815 9.36568 4.40365C9.53113 4.27877 9.71499 4.18038 9.91067 4.11198C10.2311 3.99998 10.5884 3.99998 11.303 3.99998H13.0002"></path>
            <path d="M16.0002 13.5C16.0002 15.7091 14.2093 17.5 12.0002 17.5C9.79104 17.5 8.00018 15.7091 8.00018 13.5C8.00018 11.2908 9.79104 9.49998 12.0002 9.49998C14.2093 9.49998 16.0002 11.2908 16.0002 13.5Z"></path>
            <path d="M16.0002 5.49998H21.0002M18.5002 7.99998V2.99998"></path>
          </svg>
        </button>
        <input type="text" id="user-input" placeholder="Type a message or search..." autocomplete="off" />
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>
  </div>

  </body>
</html>
