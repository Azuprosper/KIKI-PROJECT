<!-- Floating Chatbot Widget -->
<div id="chatbot-container">
  <!-- Chat Button Toggle -->
  <button id="chat-toggle-btn" onclick="toggleChat()">💬 Chat & Search</button>

  <!-- Chat Window -->
  <div id="chat-window" class="chat-hidden">
    <div class="chat-header">
      <span>Kiki Store Assistant</span>
      <button onclick="toggleChat()" class="close-btn">&times;</button>
    </div>

    <!-- Messages Container -->
    <div id="chat-messages" class="chat-messages">
      <div class="message bot-message">
        Hello! Ask me about products or upload an image to search our catalog.
      </div>
    </div>

    <!-- Input Form -->
    <form id="chat-form" onsubmit="handleSend(event)" class="chat-input-area">
      <!-- Hidden file input triggered by camera icon -->
      <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)" />
      
      <button type="button" class="icon-btn" onclick="document.getElementById('image-input').click()" title="Upload Image">📷</button>
      <input type="text" id="user-input" placeholder="Type a message or search..." autocomplete="off" />
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>

<!-- Chatbot Stylesheet -->
<style>
  #chatbot-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    font-family: Arial, sans-serif;
  }
  #chat-toggle-btn {

    color: white;

    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  #chat-window {

    height: 480px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .chat-hidden { display: none !important; }
  .chat-header {
    background: #007bff;
    color: white;
    padding: 12px 16px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .close-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
  .chat-messages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    background: #f8f9fa;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .message {

    border-radius: 12px;

  .bot-message { background: #e9ecef; align-self: flex-start; color: #333; }
  .user-message { background: #007bff; color: white; align-self: flex-end; }
  .product-card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px;
    margin-top: 6px;
    font-size: 12px;
  }
  .product-card strong { color: #007bff; display: block; }
  .chat-input-area {
    display: flex;
    padding: 8px;
    background: white;
    border-top: 1px solid #ddd;
    gap: 6px;
  }
  .chat-input-area input[type="text"] {
    flex: 1;
    border: 1px solid #ccc;
    padding: 8px;
    border-radius: 20px;
    outline: none;
  }
  .icon-btn, .send-btn {
    background: #007bff;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 15px;
    cursor: pointer;
  }
  .icon-btn { background: #6c757d; }
</style>

  </body>
<script>
  const API_URL = "http://127.0.0.1:8000";

  function toggleChat() {
    const window = document.getElementById("chat-window");
    window.classList.toggle("chat-hidden");
  }

  function appendMessage(sender, text, products = []) {
    const container = document.getElementById("chat-messages");
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${sender}-message`;
    msgDiv.innerHTML = text;

    // If products were returned, display product cards in chat
    if (products && products.length > 0) {
      products.forEach(p => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <strong>${p.name} - $${p.price}</strong>
          <div>${p.description}</div>
          <small>In Stock: ${p.stock}</small>
        `;
        msgDiv.appendChild(card);
      });
    }

    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
  }

  // Handle Text Chat Submission
  async function handleSend(event) {
    event.preventDefault();
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;

    appendMessage("user", text);
    input.value = "";

    try {
      const res = await fetch(`${API_URL}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      appendMessage("bot", data.reply, data.products);
    } catch (err) {
      appendMessage("bot", "Error connecting to server. Make sure Python backend is running!");
    }
  }

  // Handle Image Upload & Search
  async function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    appendMessage("user", `📷 Uploaded image: <em>${file.name}</em>`);

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch(`${API_URL}/image-search`, {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      appendMessage("bot", data.reply, data.products);
    } catch (err) {
      appendMessage("bot", "Failed to analyze image.");
    }
  }
</script>
