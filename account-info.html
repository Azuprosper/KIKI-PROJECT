<!DOCTYPE html>
<html>
  <head>
    <title>Account Info</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="/styles/register-login.css">
  </head>
  <body>

    <header>
        <div class="logo"><a href="index.html"><img src="images/kiki-logo.webp" alt="Kiki Logo"></a></div>
        <div class="tagline">THE BEST E-COMMERCE PLATFORM</div>
    </header>
       
         <div class="login-margin">
          <div class="my-account">My Account</div>

            <div class="form-section">
              <h2>Account Info</h2>
             <div class="account-info-container">
            <div class="info-group">
                <span class="info-label">First Name</span>
                <span id="info-firstname" class="info-value">Loading...</span>
            </div>

            <div class="info-group">
                <span class="info-label">Last Name</span>
                <span id="info-lastname" class="info-value">Loading...</span>
            </div>

            <div class="info-group">
                <span class="info-label">Username</span>
                <span id="info-username" class="info-value">Loading...</span>
            </div>

            <div class="info-group">
                <span class="info-label">Email Address</span>
                <span id="info-email" class="info-value">Loading...</span>
            </div>

            <div class="info-group">
                <span class="info-label">Phone Number</span>
                <span id="info-phone" class="info-value">Loading...</span>
            </div>
        </div>
      </div>
    </div>

          <script src="scripts/account-info.js"></script>

        
  </body>
