<!DOCTYPE html>
<html>
  <head>
    <title>Forgot Password</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="/styles/register-login.css">
  </head>
  <body>

    <header>
        <div class="logo"><a href="login.html"><img src="images/kiki-logo.webp" alt="Kiki Logo"></a></div>
        <div class="tagline">THE BEST E-COMMERCE PLATFORM</div>
    </header>
       
         <div class="login-margin">
          <div class="my-account">My Account</div>

            <div class="form-section">
              <h2>Forgot Password</h2>
              <label class="labels">Email</label>
              <input type="email" id="register-email" class="placeholders">
              <button id="login-button" class="signin-buttons">Send Reset Link</button>
              <p id="login-error" class="error-message"></p>
            </div>
          </div>

          <script src="scripts/forgot-password.js"></script>
        
  </body>
